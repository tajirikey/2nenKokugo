# GitHub Pages 自動デプロイ
# どのブランチに push しても同じ URL にデプロイされる
# URL: https://<username>.github.io/2nenKokugo/

name: Deploy to GitHub Pages

on:
  push:
    branches: ['**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
