<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4A90D9">
  <title>かんじれんしゅう</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 漢字選択画面 -->
  <div id="screen-select" class="screen active">
    <header class="app-header">
      <h1>かんじれんしゅう</h1>
      <div class="header-controls">
        <select id="grade-select" class="grade-select">
          <option value="1">1ねんせい</option>
          <option value="2" selected>2ねんせい</option>
          <option value="3">3ねんせい</option>
        </select>
        <div class="account-selector">
          <button class="account-btn active" data-account="しろ">しろ</button>
          <button class="account-btn" data-account="かわ">かわ</button>
        </div>
      </div>
    </header>

    <div class="mode-selector">
      <button class="mode-btn active" data-mode="easy">かんたん</button>
      <button class="mode-btn" data-mode="normal">ふつう</button>
      <button class="mode-btn" data-mode="hard">むずかしい</button>
    </div>

    <div class="grid-controls">
      <button id="btn-quiz" class="quiz-btn">🎯 よみかたクイズ</button>
      <div class="view-group">
        <button class="view-btn active" data-view="practice">れんしゅう</button>
        <button class="view-btn" data-view="browse">みる</button>
      </div>
      <div class="sort-group">
        <button class="sort-btn active" data-sort="default">じゅんばん</button>
        <button class="sort-btn" data-sort="random">ランダム</button>
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">ぜんぶ</button>
        <button class="filter-btn" data-filter="mistake">にがて</button>
      </div>
      <button id="btn-reset" class="reset-btn">リセット</button>
    </div>

    <div class="search-bar">
      <input type="text" id="kanji-search" placeholder="かんじをさがす...">
    </div>

    <div id="kanji-grid" class="kanji-grid">
    </div>
  </div>

  <!-- 練習画面 -->
  <div id="screen-practice" class="screen">
    <header class="practice-header">
      <button id="btn-back" class="icon-btn" aria-label="もどる">←</button>
      <div class="practice-info">
        <span id="current-kanji-label" class="current-kanji-label">字</span>
        <span id="stroke-progress" class="stroke-progress">1/6 かくめ</span>
        <span id="session-counter" class="session-counter hidden"></span>
      </div>
      <div class="practice-actions">
        <button id="btn-demo" class="icon-btn" aria-label="おてほん">▶</button>
        <button id="btn-undo" class="icon-btn" aria-label="もどす">↩</button>
        <button id="btn-clear" class="icon-btn" aria-label="けす">🗑</button>
      </div>
    </header>

    <div class="canvas-controls">
      <div class="control-group">
        <span class="control-icon">⬜</span>
        <input type="range" id="canvas-size" class="canvas-slider" min="200" max="600" step="10">
      </div>
      <div class="control-group">
        <span class="control-icon">✏️</span>
        <input type="range" id="pen-size" class="canvas-slider" min="2" max="40" step="1">
      </div>
    </div>

    <div class="canvas-container">
      <!-- 正解時の読み方表示（解答欄の中） -->
      <div id="reading-display" class="reading-display hidden"></div>
      <!-- ガイド表示用SVG -->
      <svg id="guide-svg" class="guide-svg" viewBox="0 0 109 109"></svg>
      <!-- 描画用キャンバス -->
      <canvas id="draw-canvas" class="draw-canvas"></canvas>
      <!-- グリッド線（十字のみ） -->
      <svg class="grid-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line x1="50" y1="0" x2="50" y2="100" stroke="#ddd" stroke-width="0.5" stroke-dasharray="2,2"/>
        <line x1="0" y1="50" x2="100" y2="50" stroke="#ddd" stroke-width="0.5" stroke-dasharray="2,2"/>
      </svg>
    </div>

    <!-- フィードバック表示 -->
    <div id="feedback" class="feedback hidden">
      <span id="feedback-text"></span>
    </div>

    <!-- パーティクルキャンバス -->
    <canvas id="particle-canvas" class="particle-canvas hidden"></canvas>

    <!-- 完成表示（右端配置） -->
    <div id="completion-overlay" class="completion-overlay hidden">
      <div class="completion-content">
        <span class="completion-kanji" id="completion-kanji"></span>
        <span class="completion-message">すごい！<br>かんせい！</span>
        <button id="btn-next-kanji" class="btn-primary">つぎ →</button>
      </div>
    </div>
  </div>

  <!-- よみかたクイズ: セットアップ画面 -->
  <div id="screen-quiz-setup" class="screen">
    <header class="quiz-header">
      <button id="btn-quiz-setup-back" class="icon-btn" aria-label="もどる">←</button>
      <h2 class="quiz-title">よみかたクイズ</h2>
    </header>
    <div class="quiz-setup-body">
      <div class="quiz-setup-card">
        <div class="setup-section">
          <div class="setup-label">がくねん</div>
          <div class="grade-chips">
            <button class="grade-chip" data-grade="1">1ねんせい</button>
            <button class="grade-chip" data-grade="2">2ねんせい</button>
            <button class="grade-chip" data-grade="3">3ねんせい</button>
          </div>
        </div>
        <div class="setup-section">
          <div class="setup-label">モード</div>
          <div class="quiz-mode-group">
            <button class="quiz-mode-btn active" data-quizmode="all">ぜんぶ</button>
            <button id="btn-mode-mistake" class="quiz-mode-btn" data-quizmode="mistake">にがてだけ（<span id="mistake-count">0</span>）</button>
          </div>
        </div>
        <button id="btn-quiz-start" class="quiz-start-btn">スタート！</button>
      </div>
    </div>
  </div>

  <!-- よみかたクイズ: クイズ画面 -->
  <div id="screen-quiz" class="screen">
    <header class="quiz-play-header">
      <button id="btn-quiz-back" class="icon-btn" aria-label="もどる">←</button>
      <div class="quiz-progress-info">
        <span id="quiz-question-count" class="quiz-question-count">1もんめ</span>
        <span id="quiz-streak" class="quiz-streak hidden"></span>
      </div>
    </header>

    <div class="quiz-question-area">
      <div id="quiz-type-badge" class="quiz-type-badge"></div>
      <div id="quiz-kanji-display" class="quiz-kanji-display"></div>
      <div id="quiz-correct-mark" class="quiz-correct-mark hidden">○</div>
    </div>

    <div class="quiz-choices">
      <button class="quiz-choice-btn" type="button"></button>
      <button class="quiz-choice-btn" type="button"></button>
      <button class="quiz-choice-btn" type="button"></button>
    </div>

    <!-- 10問ごとのお祝いオーバーレイ -->
    <div id="quiz-celebration-overlay" class="quiz-celebration-overlay hidden">
      <canvas id="quiz-celebration-canvas" class="quiz-celebration-canvas"></canvas>
      <div class="quiz-celebration-content">
        <div id="quiz-celebration-emoji" class="quiz-celebration-emoji">🎉</div>
        <div id="quiz-celebration-count" class="quiz-celebration-count"></div>
        <div id="quiz-celebration-message" class="quiz-celebration-message"></div>
        <div id="quiz-celebration-set-score" class="quiz-celebration-set-score"></div>
        <div id="quiz-celebration-mistakes" class="quiz-celebration-mistakes hidden">
          <div class="quiz-celebration-mistakes-label">にがてなじ:</div>
          <div id="quiz-celebration-mistakes-chips" class="quiz-celebration-mistakes-chips"></div>
        </div>
        <div id="quiz-celebration-best-streak" class="quiz-celebration-best-streak"></div>
        <div class="quiz-celebration-actions">
          <button id="btn-celebration-continue" class="quiz-start-btn">つづける</button>
          <button id="btn-celebration-end" class="quiz-celebration-end-btn">おわる</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ギャラリーモーダル（閲覧モード） -->
  <div id="gallery-modal" class="gallery-modal hidden">
    <div class="gallery-content">
      <button id="btn-gallery-close" class="gallery-close-btn">✕</button>
      <div id="gallery-reading" class="gallery-reading"></div>
      <div class="gallery-main">
        <img id="gallery-main-img" class="gallery-main-img" alt="">
      </div>
      <div class="gallery-meta">
        <span id="gallery-kanji" class="gallery-kanji-label"></span>
        <span id="gallery-date" class="gallery-date"></span>
      </div>
      <div id="gallery-history" class="gallery-history"></div>
      <button id="btn-gallery-delete" class="gallery-delete-btn">このかんじのデータをけす</button>
    </div>
  </div>

  <script src="js/kanji-data.js"></script>
  <script src="js/stroke-validator.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/quiz.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
